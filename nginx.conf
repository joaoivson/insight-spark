server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirect HTTP → HTTPS when behind proxy (Coolify/Traefik)
    # Skip redirect for /health (Coolify health checks) and when already HTTPS
    set $redirect_https 1;
    if ($request_uri ~ ^/health) { set $redirect_https 0; }
    if ($http_x_forwarded_proto = 'https') { set $redirect_https 0; }
    if ($redirect_https = 1) { return 301 https://$host$request_uri; }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache static assets (must match before SPA fallback)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|map|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html: no-cache so users get updates
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Root "/" - explicit SPA entry
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        try_files /index.html =404;
    }

    # Capture site: social media crawlers get OG meta tags from backend
    set $is_crawler "";
    if ($http_user_agent ~* "facebookexternalhit|Facebot|LinkedInBot|Twitterbot|WhatsApp|TelegramBot|Slackbot|Discordbot|Pinterest") {
        set $is_crawler "1";
    }
    location ~ ^/c/([^/]+)$ {
        if ($is_crawler = "1") {
            return 302 https://api.marketdash.com.br/c/$1/og;
        }
        try_files $uri /index.html;
    }

    # Custom links: same OG treatment for social media crawlers
    location ~ ^/l/([^/]+)$ {
        if ($is_crawler = "1") {
            return 302 https://api.marketdash.com.br/l/$1/og;
        }
        try_files $uri /index.html;
    }

    # Link de entrada dos grupos: a página INTEIRA vem do backend — ela escolhe
    # o grupo com vaga, registra o clique e dispara o pixel antes do redirect.
    # Não é só OG para crawler como /c e /l: aqui todo visitante vai ao backend.
    location ~ ^/g/(preview/)?([^/]+)$ {
        proxy_pass https://api.marketdash.com.br$request_uri;
        proxy_set_header Host api.marketdash.com.br;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    # SPA fallback: all other routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint (optional)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
